<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirilampo — Zaragata no Prado</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1b1430; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; outline: none; background: #7fd0f5;
           -webkit-tap-highlight-color: transparent; user-select: none; }
</style>
</head>
<body>
<canvas id="jogo" tabindex="0" aria-label="Pirilampo — jogo de tiros horizontal"></canvas>
<script>
/* =====================================================================
   PIRILAMPO — Zaragata no Prado
   Shoot 'em up horizontal, cartoon, num único ficheiro (HTML5 Canvas).
   Tudo é desenhado por código: não há imagens nem sons externos.

   Índice do código:
     1. Constantes e ecrã        6. Jogador
     2. Utilitários de desenho   7. Inimigos, balas e itens
     3. Som e música             8. Boss (Sapo Barrigudo)
     4. Controlos                9. Guião do nível
     5. Cenário (parallax)      10. Ciclo principal, HUD e ecrãs
   ===================================================================== */
(() => {
'use strict';

/* ---------- 1. Constantes e ecrã ---------- */
const W = 960, H = 540;            // resolução lógica do jogo
const GROUND = H - 44;             // altura do chão
const TAU = Math.PI * 2;
const OUT = '#2b1d3a';             // cor do contorno "cartoon"
const FONT = "'Fredoka','Trebuchet MS','Segoe UI',sans-serif";
const SCROLL = 1.6;                // velocidade do cenário (px por frame)

const cv = document.getElementById('jogo');
const ctx = cv.getContext('2d');
let rs = 1;                        // escala de renderização

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  rs = Math.max(0.5, Math.min(s * dpr, 2.5));
  cv.width = Math.round(W * rs);
  cv.height = Math.round(H * rs);
}
addEventListener('resize', resize);
resize();

// Estado global do jogo (exposto em window.PIRILAMPO para poderes mexer na consola)
const G = {
  state: 'title',      // 'title' | 'play' | 'over'
  paused: false, frame: 0, scroll: 0, scrollV: SCROLL,
  score: 0, hi: 0, lives: 3, bombs: 2, loop: 0, nextLife: 30000,
  lt: 0, events: [], evi: 0, banner: 0, warn: 0, clear: 0, overT: 0,
  shake: 0, flash: 0, touch: false, newHi: false,
  p: null, shots: [], enemies: [], bullets: [], items: [], parts: [], boss: null,
};
window.PIRILAMPO = G;
try { G.hi = parseInt(localStorage.getItem('pirilampo_hi') || '0', 10) || 0; } catch (e) { G.hi = 0; }

/* ---------- 2. Utilitários de desenho ---------- */
function mulberry32(a) {            // gerador pseudo-aleatório com semente (cenário sempre igual)
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function ell(x, y, rx, ry, fill, stroke = OUT, lw = 3, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.max(0.5, Math.abs(rx)), Math.max(0.5, Math.abs(ry)), rot, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function seg(x1, y1, x2, y2, col = OUT, lw = 3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.stroke();
}
function txt(s, x, y, size, fill = '#fff', align = 'center', stroke = OUT, lw = 5) {
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
// Olho cartoon que segue um ponto (tx, ty) em coordenadas do ecrã
function eye(x, y, r, wx, wy, tx, ty, angry = false) {
  ell(x, y, r, r, '#fff', OUT, 2.5);
  const a = Math.atan2(ty - wy, tx - wx);
  ell(x + Math.cos(a) * r * 0.4, y + Math.sin(a) * r * 0.4, r * 0.45, r * 0.45, OUT, null);
  if (angry) seg(x - r * 1.1, y - r * 1.3, x + r * 0.9, y - r * 0.5, OUT, 3);
}
// Asa a bater
function wing(x, y, rx, ry, base, phase = 0, col = 'rgba(255,255,255,.78)') {
  const f = Math.sin(G.frame * 0.9 + phase);
  ctx.save(); ctx.translate(x, y); ctx.rotate(base + f * 0.5);
  ell(rx, 0, rx, ry, col, OUT, 2);
  ctx.restore();
}

/* ---------- 3. Som e música (WebAudio, tudo sintetizado) ---------- */
let ac = null, master = null, noiseBuf = null, muted = false;
function audioInit() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0, when = 0) {
  if (!ac) return;
  try {
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, vol = 0.2, cutoff = 1800) {
  if (!ac) return;
  try {
    const t = ac.currentTime, s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t);
    f.frequency.exponentialRampToValueAtTime(120, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  shot:  () => tone(880, 0.05, 'square', 0.025, -300),
  hit:   () => tone(300, 0.05, 'square', 0.05, -120),
  boom:  () => { noise(0.3, 0.22); tone(140, 0.25, 'triangle', 0.15, -90); },
  big:   () => { noise(0.5, 0.35, 2600); tone(90, 0.5, 'sawtooth', 0.15, -50); },
  item:  () => [660, 880, 1320].forEach((f, i) => tone(f, 0.09, 'square', 0.07, 0, i * 0.06)),
  life:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.08, 0, i * 0.09)),
  die:   () => { tone(500, 0.6, 'sawtooth', 0.14, -440); noise(0.4, 0.2); },
  bomb:  () => { noise(0.5, 0.4, 4000); tone(1200, 0.7, 'sine', 0.15, -1100); },
  warn:  () => [0, 0.35, 0.7, 1.05].forEach(w => tone(440, 0.22, 'square', 0.08, 180, w)),
  croak: () => tone(110, 0.3, 'sawtooth', 0.13, -50),
  lick:  () => tone(200, 0.2, 'triangle', 0.16, 500),
};
// Música: um ciclo simples de 4 compassos (baixo + melodia), agendado um pouco à frente do relógio do áudio
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const BASS = [[48,48,55,48,52,48,55,52],[45,45,52,45,48,45,52,48],[41,41,48,41,45,41,48,45],[43,43,50,43,47,43,50,47]];
const LEAD = [
  [72,0,76,0,79,0,76,72, 0,74,76,0,79,0,84,0],
  [81,0,76,0,72,0,76,81, 0,79,76,0,72,0,69,0],
  [77,0,81,0,84,0,81,77, 0,76,77,0,81,0,84,0],
  [83,0,79,0,74,0,79,83, 0,86,83,0,79,0,74,0]];
let mStep = 0, mNext = 0;
function music() {
  if (!ac || ac.state !== 'running' || G.state !== 'play' || G.paused) return;
  const boss = !!G.boss, stepDur = boss ? 0.088 : 0.11, tr = boss ? -3 : 0;
  if (mNext < ac.currentTime) mNext = ac.currentTime + 0.05;
  while (mNext < ac.currentTime + 0.15) {
    const bar = (mStep >> 4) & 3, s = mStep & 15, when = mNext - ac.currentTime;
    if (s % 2 === 0) tone(midi(BASS[bar][s >> 1] + tr - 12), stepDur * 1.7, 'triangle', 0.11, 0, when);
    const n = LEAD[bar][s];
    if (n) tone(midi(n + tr), stepDur * 1.3, boss ? 'sawtooth' : 'square', boss ? 0.028 : 0.032, 0, when);
    if (s % 4 === 2) tone(6000, 0.02, 'square', 0.008, 0, when);   // "prato" discreto
    mNext += stepDur; mStep++;
  }
}

/* ---------- 4. Controlos ---------- */
const keys = {};
const GAME_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD',
                   'KeyZ','KeyX','KeyJ','KeyK','Enter','KeyP','KeyM','KeyF','Escape'];
addEventListener('keydown', e => {
  audioInit();
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'Enter' || e.code === 'Space') {
    if (G.state === 'title' || (G.state === 'over' && G.overT > 60)) startGame();
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && G.state === 'play') G.paused = !G.paused;
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }
  if (e.code === 'KeyF') { try { (document.fullscreenElement ? document.exitFullscreen() : cv.requestFullscreen()).catch(() => {}); } catch (err) {} }
  if ((e.code === 'KeyX' || e.code === 'KeyK') && G.state === 'play' && !G.paused) useBomb();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.state === 'play') G.paused = true; });

// Toque: arrastar o dedo move o pirilampo (dispara sozinho); botão no canto = clarão
let drag = null;
const BOMB_BTN = { x: W - 62, y: H - 62, r: 40 };
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  audioInit(); cv.focus(); e.preventDefault();
  const pt = toGame(e);
  if (e.pointerType === 'touch') G.touch = true;
  if (G.state === 'title' || (G.state === 'over' && G.overT > 60)) { startGame(); return; }
  if (G.state !== 'play') return;
  if (G.paused) { G.paused = false; return; }
  if (e.pointerType !== 'touch') return;
  if (Math.hypot(pt.x - BOMB_BTN.x, pt.y - BOMB_BTN.y) < BOMB_BTN.r + 10) { useBomb(); return; }
  drag = { id: e.pointerId, x: pt.x, y: pt.y };
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !G.p || G.p.dead) return;
  const pt = toGame(e);
  G.p.x += (pt.x - drag.x) * 1.25; G.p.y += (pt.y - drag.y) * 1.25;
  drag.x = pt.x; drag.y = pt.y;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 5. Cenário (parallax) ---------- */
const sr = mulberry32(7);
const clouds  = Array.from({ length: 6 },  (_, i) => ({ x: i * 240 + sr() * 120, y: 70 + sr() * 110, s: 0.7 + sr() * 0.7 }));
const FCOL = ['#ffffff', '#ffb3d1', '#ffe27a', '#c9b6ff'];
const flowers = Array.from({ length: 9 },  (_, i) => ({ x: i * 210 + sr() * 90, h: 110 + sr() * 200, type: (sr() * 3) | 0, c: FCOL[(sr() * 4) | 0] }));
const tufts   = Array.from({ length: 16 }, (_, i) => ({ x: i * 60 + sr() * 30, h: 14 + sr() * 18 }));
const fore    = Array.from({ length: 7 },  (_, i) => ({ x: i * 190 + sr() * 80, h: 44 + sr() * 40, lean: sr() * 0.6 - 0.3 }));
const wrap = (x, f, P, m) => ((x - G.scroll * f) % P + P) % P - m;

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6cc7f2'); g.addColorStop(0.7, '#cfeecb'); g.addColorStop(1, '#f6f3c2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sol
  ctx.save(); ctx.translate(820, 105); ctx.rotate(G.frame * 0.002);
  ctx.fillStyle = 'rgba(255,240,170,.5)';
  for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(-9, 52); ctx.lineTo(0, 86); ctx.lineTo(9, 52); ctx.fill(); }
  ctx.restore();
  ell(820, 105, 44, 44, '#fff3a6', '#ffd95e', 4);
  // nuvens
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const c of clouds) {
    const x = wrap(c.x, 0.12, 1440, 160);
    if (x > W + 160) continue;
    ctx.beginPath();
    ctx.ellipse(x, c.y, 54 * c.s, 20 * c.s, 0, 0, TAU); ctx.ellipse(x - 26 * c.s, c.y - 13 * c.s, 26 * c.s, 19 * c.s, 0, 0, TAU);
    ctx.ellipse(x + 20 * c.s, c.y - 18 * c.s, 30 * c.s, 24 * c.s, 0, 0, TAU); ctx.fill();
  }
  // colinas
  hills(0.25, 372, '#a9dd93', 0.004, 34);
  hills(0.45, 424, '#84cb6f', 0.006, 24);
  // flores e cogumelos gigantes
  for (const f of flowers) {
    const x = wrap(f.x, 0.7, 1890, 130);
    if (x > W + 130) continue;
    drawFlower(x, f);
  }
  ctx.fillStyle = 'rgba(207,238,214,.42)'; ctx.fillRect(0, 0, W, GROUND);   // véu de distância: afasta o fundo
  // chão
  ctx.fillStyle = '#5aa648'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#4b9140'; ctx.fillRect(0, GROUND, W, 6);
  ctx.fillStyle = '#6dbb55';
  for (const t of tufts) {
    const x = wrap(t.x, 1, 960, 30);
    ctx.beginPath(); ctx.moveTo(x - 9, GROUND + 2); ctx.lineTo(x - 5, GROUND - t.h * 0.7); ctx.lineTo(x - 1, GROUND + 2);
    ctx.lineTo(x + 3, GROUND - t.h); ctx.lineTo(x + 7, GROUND + 2); ctx.lineTo(x + 11, GROUND - t.h * 0.6); ctx.lineTo(x + 14, GROUND + 2); ctx.fill();
  }
}
function hills(f, base, col, k, amp) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) {
    const wx = x + G.scroll * f;
    ctx.lineTo(x, base + Math.sin(wx * k) * amp + Math.sin(wx * k * 2.7 + 1) * amp * 0.35);
  }
  ctx.lineTo(W, H); ctx.fill();
}
function drawFlower(x, f) {
  const sway = Math.sin(G.frame * 0.02 + f.x) * 6, ST = '#4f9b52';
  if (f.type === 2) {                               // cogumelo
    const h = 70 + f.h * 0.25;
    rrect(x - 14, GROUND - h, 28, h + 2, 10, '#f3ead2', '#d9c9a3', 3);
    ctx.beginPath(); ctx.ellipse(x, GROUND - h, 62, 36, 0, Math.PI, TAU); ctx.closePath();
    ctx.fillStyle = '#e8705f'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#c4544a'; ctx.stroke();
    ell(x - 26, GROUND - h - 14, 9, 7, '#fff3ea', null); ell(x + 8, GROUND - h - 24, 11, 8, '#fff3ea', null); ell(x + 34, GROUND - h - 10, 7, 5, '#fff3ea', null);
    return;
  }
  const top = GROUND - f.h;
  ctx.beginPath(); ctx.moveTo(x, GROUND + 2); ctx.quadraticCurveTo(x - 14, GROUND - f.h * 0.5, x + sway, top);
  ctx.lineWidth = 9; ctx.strokeStyle = ST; ctx.lineCap = 'round'; ctx.stroke();
  ell(x - 20, GROUND - f.h * 0.42, 22, 8, '#63b262', null, 0, -0.5);
  ell(x + 12, GROUND - f.h * 0.6, 20, 7, '#63b262', null, 0, 0.5);
  if (f.type === 0) {                               // malmequer
    ctx.fillStyle = f.c;
    for (let i = 0; i < 9; i++) { const a = i * TAU / 9 + G.frame * 0.003; ctx.beginPath(); ctx.ellipse(x + sway + Math.cos(a) * 24, top + Math.sin(a) * 24, 17, 9, a, 0, TAU); ctx.fill(); }
    ell(x + sway, top, 15, 15, '#ffcf4a', '#eeb42f', 3);
  } else {                                          // túlipa
    ctx.fillStyle = '#ff8f7a';
    ctx.beginPath(); ctx.moveTo(x + sway - 26, top - 34); ctx.quadraticCurveTo(x + sway - 30, top + 16, x + sway, top + 16);
    ctx.quadraticCurveTo(x + sway + 30, top + 16, x + sway + 26, top - 34); ctx.lineTo(x + sway + 12, top - 14);
    ctx.lineTo(x + sway, top - 40); ctx.lineTo(x + sway - 12, top - 14); ctx.closePath(); ctx.fill();
  }
}
function drawForeground() {
  ctx.fillStyle = 'rgba(37,92,48,.6)';
  for (const b of fore) {
    const x = wrap(b.x, 1.8, 1330, 80);
    if (x > W + 80) continue;
    ctx.beginPath(); ctx.moveTo(x - 16, H); ctx.quadraticCurveTo(x - 8 + b.lean * 40, H - b.h * 0.6, x + b.lean * 70, H - b.h);
    ctx.quadraticCurveTo(x + 10 + b.lean * 30, H - b.h * 0.5, x + 16, H); ctx.fill();
  }
}

/* ---------- Partículas ---------- */
function explode(x, y, size = 1) {
  const cols = ['#ffffff', '#ffe066', '#ff9a3d', '#ff6b5e'];
  for (let i = 0; i < 7 * size; i++) {
    const a = rand(0, TAU), v = rand(1, 4) * Math.sqrt(size);
    G.parts.push({ k: 'puff', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(16, 30), r: rand(5, 11) * Math.sqrt(size), c: cols[(Math.random() * 4) | 0] });
  }
  for (let i = 0; i < 4 * size; i++) {
    const a = rand(0, TAU), v = rand(3, 7);
    G.parts.push({ k: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(14, 26), r: rand(3, 6), c: '#fff7b0' });
  }
  G.parts.push({ k: 'ring', x, y, vx: 0, vy: 0, life: 0, max: 16, r: 14 * size, c: '#fff' });
  G.shake = Math.max(G.shake, 3 * size);
}
function popup(x, y, s, c = '#fff') { G.parts.push({ k: 'txt', x, y, vx: 0, vy: -0.9, life: 0, max: 50, s, c }); }
function updParts() {
  for (const q of G.parts) { q.life++; q.x += q.vx; q.y += q.vy; if (q.k !== 'txt') { q.vx *= 0.93; q.vy *= 0.93; } }
  G.parts = G.parts.filter(q => q.life < q.max);
}
function drawParts() {
  for (const q of G.parts) {
    const t = q.life / q.max;
    ctx.globalAlpha = 1 - t * t;
    if (q.k === 'puff') ell(q.x, q.y, q.r * (1 + t), q.r * (1 + t), q.c, OUT, 2);
    else if (q.k === 'star') { ctx.fillStyle = q.c; ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + q.life * 0.2, r = i % 2 ? q.r * 0.4 : q.r; ctx.lineTo(q.x + Math.cos(a) * r, q.y + Math.sin(a) * r); } ctx.fill(); }
    else if (q.k === 'ring') { ctx.beginPath(); ctx.arc(q.x, q.y, q.r + t * q.r * 3, 0, TAU); ctx.lineWidth = 5 * (1 - t) + 1; ctx.strokeStyle = q.c; ctx.stroke(); }
    else txt(q.s, q.x, q.y, 17, q.c, 'center', OUT, 4);
  }
  ctx.globalAlpha = 1;
}

/* ---------- 6. Jogador ---------- */
function newPlayer() { return { x: 130, y: 270, power: 1, speed: 0, cd: 0, inv: 150, dead: false, deadT: 0 }; }

function updPlayer() {
  const p = G.p;
  if (p.dead) {
    p.deadT++;
    if (p.deadT > 70) {
      if (G.lives < 0) { gameOver(); return; }
      p.dead = false; p.x = 130; p.y = 270; p.inv = 160; G.bullets = [];
    }
    return;
  }
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);

  }
  ctx.save(); ctx.translate(b.x, b.y + Math.sin(b.t * 0.06) * 3);
  ell(-52, 62, 36, 18, C('#3f9a3a'), OUT, 4); ell(54, 62, 36, 18, C('#3f9a3a'), OUT, 4);        // patas
  ell(0, 10, 84, 68, C('#5cc24a'), OUT, 4);                                                      // corpo
  ell(-10, 34, 58, 40, '#e9f7b0', null);                                          // barriga
  ell(40, -20, 9, 6, '#49a83d', null); ell(56, 6, 7, 5, '#49a83d', null); ell(30, -40, 6, 4, '#49a83d', null);
  ell(-42, -50, 25, 25, C('#5cc24a'), OUT, 4); ell(16, -56, 25, 25, C('#5cc24a'), OUT, 4);        // olhos
  for (const [ox, oy] of [[-44, -52], [14, -58]]) {
    ell(ox, oy, 17, 17, '#fff', OUT, 3);
    const a = Math.atan2(p.y - (b.y + oy), p.x - (b.x + ox));
    ell(ox + Math.cos(a) * 7, oy + Math.sin(a) * 7, 8, 8, OUT, null);
    seg(ox - 20, oy - 22, ox + 14, oy - 12 - (b.hp < b.max * 0.5 ? 6 : 0), OUT, 5);
  }
  if (b.mouth < 0.12) {                                                                          // boca
    ctx.beginPath(); ctx.moveTo(-78, 2); ctx.quadraticCurveTo(-34, 30, 20, 8); ctx.lineWidth = 4; ctx.strokeStyle = OUT; ctx.stroke();
  } else {
    ell(-34, 12, 40, 6 + 26 * b.mouth, '#7a1f3a', OUT, 4);
    ell(-34, 12 + 14 * b.mouth, 24, 3 + 10 * b.mouth, '#ff7fa0', null);
  }
  ell(-16, 58, 14, 9, C('#49a83d'), OUT, 3); ell(18, 60, 14, 9, C('#49a83d'), OUT, 3);            // mãos
  ctx.restore();
}

/* ---------- 9. Guião do nível (tempo em segundos -> o que aparece) ---------- */
function buildLevel() {
  const ev = [];
  const at = (s, f) => ev.push({ t: Math.round(s * 60), f });
  const row = (s, n, gap, f) => { for (let i = 0; i < n; i++) at(s + i * gap, () => f(i)); };
  const mosq = (y, amp = 30, ph = 0) => spawn('mosq', { y, by: y, amp, ph });
  const vespa = y => spawn('vespa', { y });
  const beetle = y => spawn('beetle', { y, by: y, x: W + 50 });
  const spider = ty => spawn('spider', { x: W + 20, y: -20, ty, ph: 0, st: 0 });
  const snail = () => spawn('snail', { y: GROUND - 16 });
  const moth = (y, d) => spawn('moth', { y, d, ang: Math.PI, turned: 0 });
  const carrier = (y, kind) => spawn('carrier', { y, by: y, drop: kind });

  row(2, 5, .3, i => mosq(150, 30, i * .5));
  row(6, 5, .3, i => mosq(380, 30, i * .5));
  at(10, () => carrier(200, 'P'));
  at(12, () => vespa(130)); at(13, () => vespa(400));
  row(17, 5, .3, i => mosq(120, 40, i * .6)); row(18.5, 5, .3, i => mosq(400, 40, i * .6));
  at(21, snail); at(22.5, () => spider(170));
  row(26, 6, .22, () => moth(90, 1));
  at(31, () => beetle(260));
  at(35, () => vespa(100)); at(35.6, () => vespa(260)); at(36.2, () => vespa(420));
  at(40, () => carrier(330, 'S'));
  at(43, () => spider(150)); at(44.5, () => spider(300)); at(45, snail); at(46, () => spider(210));
  row(49, 8, .25, i => mosq(250, 120, i * .45));
  at(54, () => beetle(160)); at(55.5, () => beetle(380));
  row(60, 6, .22, () => moth(90, 1)); row(62, 6, .22, () => moth(GROUND - 60, -1));
  at(66, () => carrier(180, 'B'));
  at(68, () => vespa(110)); at(68.5, () => vespa(210)); at(69, () => vespa(310)); at(69.5, () => vespa(410));
  at(74, snail); at(75, () => spider(160)); at(76, snail); at(77, () => spider(260));
  row(78, 5, .3, i => mosq(200, 50, i * .5));
  at(82, () => beetle(270)); at(83, () => vespa(120)); at(83.5, () => vespa(420));
  at(88, () => carrier(260, 'P'));
  row(90, 6, .25, i => mosq(110, 30, i * .5)); row(91.5, 6, .25, i => mosq(260, 30, i * .5)); row(93, 6, .25, i => mosq(410, 30, i * .5));
  row(98, 6, .22, () => moth(100, 1)); at(99, () => spider(200)); at(100.5, () => spider(320)); at(101, () => beetle(150));
  at(107, () => { G.warn = 200; sfx.warn(); });
  at(111, spawnBoss);
  ev.sort((a, b) => a.t - b.t);
  return ev;
}

/* ---------- 10. Ciclo principal, HUD e ecrãs ---------- */
function startLevel() {
  G.lt = 0; G.events = buildLevel(); G.evi = 0;
  G.enemies = []; G.bullets = []; G.shots = []; G.items = [];
  G.boss = null; G.banner = 170; G.warn = 0; G.clear = 0;
}
function startGame() {
  G.state = 'play'; G.paused = false; G.score = 0; G.lives = 3; G.bombs = 2; G.loop = 0;
  G.nextLife = 30000; G.newHi = false; G.parts = []; G.p = newPlayer();
  startLevel();
}
function gameOver() {
  G.state = 'over'; G.overT = 0; drag = null;
  if (G.score > G.hi) { G.hi = G.score; G.newHi = true; try { localStorage.setItem('pirilampo_hi', String(G.hi)); } catch (e) {} }
}

function updPlay() {
  const p = G.p;
  G.lt++;
  while (G.evi < G.events.length && G.events[G.evi].t <= G.lt) G.events[G.evi++].f();
  G.scrollV = G.boss ? Math.max(0, G.scrollV - 0.02) : Math.min(SCROLL, G.scrollV + 0.02);
  G.scroll += G.scrollV;
  if (G.banner > 0) G.banner--;
  if (G.warn > 0) G.warn--;
  if (G.flash > 0) G.flash--;

  updPlayer();
  if (G.state !== 'play') return;

  // tiros do jogador
  for (const s of G.shots) {
    s.x += s.vx; s.y += s.vy;
    for (const e of G.enemies) {
      if (e.hp > 0 && e.x < W + 10 && Math.hypot(s.x - e.x, s.y - e.y) < e.r + 7) { damage(e, 1); s.dead = true; break; }
    }
    const b = G.boss;
    if (!s.dead && b && b.state !== 'enter' && b.state !== 'dying' && Math.hypot(s.x - b.x, s.y - (b.y + 6)) < 80) {
      if (b.budget >= 1) { b.budget--; hitBoss(1); }
      s.dead = true; if (G.frame % 3 === 0) sfx.hit();
      G.parts.push({ k: 'star', x: s.x, y: s.y, vx: -2, vy: rand(-2, 2), life: 0, max: 10, r: 5, c: '#fff7b0' });
    }
  }
  G.shots = G.shots.filter(s => !s.dead && s.x < W + 20 && s.y > -20 && s.y < H + 20);

  updEnemies();
  if (G.boss) updBoss();

  // balas inimigas
  for (const b of G.bullets) {
    b.x += b.vx; b.y += b.vy; b.vy += b.g;
    if (b.g && b.y > GROUND + 4) b.dead = true;
    if (!p.dead && p.inv <= 0 && Math.hypot(b.x - p.x, b.y - p.y) < b.r + 3) { b.dead = true; hurtPlayer(); }
  }
  G.bullets = G.bullets.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -40 && b.y < H + 20);

  // choque com inimigos
  if (!p.dead) for (const e of G.enemies) if (Math.hypot(e.x - p.x, e.y - p.y) < e.r * 0.7 + 5) { hurtPlayer(); break; }

  // itens
  for (const it of G.items) {
    it.t++; it.x -= 1.3; it.y += Math.sin(it.t * 0.08) * 0.9;
    it.y = clamp(it.y, 60, GROUND - 20);
    if (!p.dead && Math.hypot(it.x - p.x, it.y - p.y) < 30) { it.dead = true; collect(it); }
  }
  G.items = G.items.filter(it => !it.dead && it.x > -30);

  // nível concluído -> próxima volta, mais difícil
  if (G.clear > 0) {
    G.clear++;
    if (G.clear === 60) { const bonus = Math.max(0, G.lives) * 2000; addScore(bonus); }
    if (G.clear > 300) { G.loop++; startLevel(); }
  }
}

function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + 6 * s);
  ctx.bezierCurveTo(x - 10 * s, y - 2 * s, x - 5 * s, y - 9 * s, x, y - 3 * s);
  ctx.bezierCurveTo(x + 5 * s, y - 9 * s, x + 10 * s, y - 2 * s, x, y + 6 * s);
  ctx.fillStyle = '#ff5d7a'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = OUT; ctx.stroke();
}
function pips(x, y, n, max, col) {
  for (let i = 0; i < max; i++) rrect(x + i * 11, y - 7, 8, 14, 3, i < n ? col : 'rgba(255,255,255,.18)', OUT, 2);
}
function drawHUD() {
  const p = G.p;
  ctx.fillStyle = 'rgba(27,20,48,.72)'; ctx.fillRect(0, 0, W, 38);
  txt('PONTOS', 14, 20, 13, '#ffd84a', 'left', null);
  txt(String(G.score).padStart(7, '0'), 74, 20, 20, '#fff', 'left', null);
  txt('RECORDE', 196, 20, 13, '#9fd8ff', 'left', null);
  txt(String(Math.max(G.hi, G.score)).padStart(7, '0'), 266, 20, 20, '#fff', 'left', null);
  heart(402, 19, 1.1); txt('×' + Math.max(0, G.lives), 416, 20, 19, '#fff', 'left', null);
  ell(472, 19, 9, 9, '#ffc830', OUT, 2); txt('×' + G.bombs, 486, 20, 19, '#fff', 'left', null);
  txt('TIRO', 548, 20, 13, '#ff9a9a', 'left', null); pips(586, 19, p.power, 4, '#ff5d5d');
  txt('VEL', 648, 20, 13, '#9fd0ff', 'left', null); pips(680, 19, p.speed + 1, 4, '#4aa8ff');
  txt(G.loop ? 'VOLTA ' + (G.loop + 1) : 'O PRADO', W - 14, 20, 15, '#c8f7a0', 'right', null);
  if (muted) txt('SEM SOM', W - 110, 20, 12, '#ff9a9a', 'right', null);

  if (G.boss && G.boss.state !== 'enter') {
    const b = G.boss, w = 420, x = (W - w) / 2, y = H - 26;
    rrect(x - 3, y - 3, w + 6, 16, 8, 'rgba(27,20,48,.8)', OUT, 3);
    if (b.hp > 0) rrect(x, y, Math.max(10, w * b.hp / b.max), 10, 5, b.hp < b.max / 2 ? '#ff5d5d' : '#8be36a', null);
    txt('SAPO BARRIGUDO', W / 2, y - 14, 15, '#fff', 'center', OUT, 4);
  }
  if (G.touch) {
    ctx.globalAlpha = G.bombs > 0 ? 0.85 : 0.35;
    ell(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.r, BOMB_BTN.r, '#ffc830', OUT, 4);
    txt('CLARÃO', BOMB_BTN.x, BOMB_BTN.y, 14, '#fff', 'center', OUT, 4);
    ctx.globalAlpha = 1;
  }
  if (G.banner > 0) {
    ctx.globalAlpha = Math.min(1, G.banner / 30);
    txt(G.loop ? 'VOLTA ' + (G.loop + 1) : 'NÍVEL 1 — O PRADO', W / 2, 210, 44, '#fff', 'center', OUT, 9);
    txt(G.loop ? 'Os bichos voltaram mais zangados!' : 'Corre com a bicharada!', W / 2, 256, 22, '#ffe066', 'center', OUT, 6);
    ctx.globalAlpha = 1;
  }
  if (G.warn > 0 && (G.warn >> 3) % 2) {
    txt('CUIDADO!', W / 2, 220, 60, '#ff4d5e', 'center', '#fff', 10);
    txt('Vem aí o Sapo Barrigudo', W / 2, 272, 24, '#fff', 'center', OUT, 6);
  }
  if (G.clear > 30) {
    txt('PRADO SALVO!', W / 2, 210, 56, '#ffe066', 'center', OUT, 10);
    txt('Bónus de vidas: ' + Math.max(0, G.lives) + ' × 2000', W / 2, 262, 24, '#fff', 'center', OUT, 6);
    if (G.clear > 150) txt('Prepara-te para a volta ' + (G.loop + 2) + '…', W / 2, 298, 20, '#c8f7a0', 'center', OUT, 5);
  }
  if (G.paused) {
    ctx.fillStyle = 'rgba(27,20,48,.55)'; ctx.fillRect(0, 0, W, H);
    txt('PAUSA', W / 2, 240, 60, '#fff', 'center', OUT, 10);
    txt(G.touch ? 'Toca para continuar' : 'P para continuar', W / 2, 296, 22, '#ffe066', 'center', OUT, 6);
  }
}

function drawWorld() {
  const p = G.p;
  for (const it of G.items) drawItem(it.x, it.y, it.kind);
  for (const e of G.enemies) drawEnemy(e);
  if (G.boss) drawBoss();
  for (const s of G.shots) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
    ell(0, 0, 11, 4.5, '#fff06a', '#e08a1e', 2); ell(2, 0, 5, 2, '#fff', null); ctx.restore();
  }
  if (p && !p.dead && G.state === 'play') {
    if (p.inv <= 0 || (G.frame >> 2) % 2) drawPlayer(p.x, p.y);
  }
  for (const b of G.bullets) drawBullet(b);
  drawParts();
}

function drawTitle() {
  const f = G.frame;
  ctx.fillStyle = 'rgba(27,20,48,.25)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 128); ctx.rotate(Math.sin(f * 0.03) * 0.02);
  txt('PIRILAMPO', 0, 0, 104, '#fff06a', 'center', OUT, 16);
  txt('PIRILAMPO', 0, -3, 104, '#fff06a', 'center', '#e2681c', 5);
  ctx.restore();
  txt('ZARAGATA NO PRADO', W / 2, 206, 34, '#fff', 'center', OUT, 8);
  ctx.save(); ctx.translate(210, 300 + Math.sin(f * 0.05) * 10); ctx.scale(2.6, 2.6); drawPlayer(0, 0); ctx.restore();

  rrect(360, 248, 500, 176, 18, 'rgba(27,20,48,.78)', OUT, 4);
  const rows = G.touch
    ? [['Arrastar o dedo', 'voar (dispara sozinho)'], ['Botão CLARÃO', 'limpa o ecrã'], ['', ''], ['', '']]
    : [['Setas ou WASD', 'voar'], ['Espaço ou Z', 'disparar (manter premido)'], ['X', 'clarão — limpa o ecrã'], ['P · M · F', 'pausa · som · ecrã inteiro']];
  rows.forEach((r, i) => { txt(r[0], 384, 276 + i * 27, 18, '#ffe066', 'left', null); txt(r[1], 548, 276 + i * 27, 18, '#fff', 'left', null); });
  drawItem(398, 394, 'P'); txt('tiro', 420, 395, 16, '#fff', 'left', null);
  drawItem(500, 394, 'S'); txt('velocidade', 522, 395, 16, '#fff', 'left', null);
  drawItem(660, 394, 'B'); txt('clarão', 682, 395, 16, '#fff', 'left', null);

  if ((f >> 5) % 2) txt(G.touch ? 'TOCA PARA COMEÇAR' : 'ENTER OU CLIQUE PARA COMEÇAR', W / 2, 462, 26, '#fff', 'center', OUT, 7);
  if (G.hi) txt('RECORDE  ' + String(G.hi).padStart(7, '0'), W / 2, 22, 18, '#fff', 'center', OUT, 5);
}
function drawOver() {
  ctx.fillStyle = 'rgba(27,20,48,.6)'; ctx.fillRect(0, 0, W, H);
  txt('FIM DE JOGO', W / 2, 190, 70, '#ff6b7d', 'center', OUT, 12);
  txt('Pontos: ' + G.score, W / 2, 262, 34, '#fff', 'center', OUT, 7);
  if (G.newHi) txt('NOVO RECORDE!', W / 2, 306, 26, '#ffe066', 'center', OUT, 6);
  else txt('Recorde: ' + G.hi, W / 2, 306, 22, '#9fd8ff', 'center', OUT, 5);
  if (G.overT > 60 && (G.frame >> 5) % 2) txt(G.touch ? 'TOCA PARA JOGAR OUTRA VEZ' : 'ENTER PARA JOGAR OUTRA VEZ', W / 2, 380, 24, '#fff', 'center', OUT, 6);
}

function step() {
  G.frame++;
  if (G.state === 'play') { if (!G.paused) { updPlay(); updParts(); } }
  else { G.scroll += SCROLL * 0.6; updParts(); if (G.state === 'over') G.overT++; }
  if (G.shake > 0) G.shake *= 0.85;
}
function render() {
  ctx.setTransform(rs, 0, 0, rs, 0, 0);
  ctx.save();
  if (G.shake > 0.5 && !G.paused) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  drawBackground();
  if (G.state !== 'title') drawWorld();
  drawForeground();
  ctx.restore();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,230,${Math.min(0.8, G.flash / 40)})`; ctx.fillRect(0, 0, W, H); }
  if (G.state === 'title') drawTitle();
  else { drawHUD(); if (G.state === 'over') drawOver(); }
}

// Passo fixo a 60 atualizações por segundo, independente da taxa do monitor
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
  if (n === 5) acc = 0;
  music();
  render();
  requestAnimationFrame(loop);
}
G._step = step; G._render = render;      // usados nos testes automáticos
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka').catch(() => {});
requestAnimationFrame(loop);
})();
</script>
